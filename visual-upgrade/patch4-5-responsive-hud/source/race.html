<section id="race" class="screen" hidden aria-label="Balapan" data-controls="keyboard">
 <div class="rq-layout" id="hudLayout">
  <header class="rq-top">
   <section class="rq-card rq-summary" aria-label="Posisi dan waktu">
    <div class="rq-position"><small>POSISI</small><div><strong id="hudRank">1</strong><span>/5</span></div></div>
    <div class="rq-timing"><small id="hudLap">PUTARAN 1 / 3</small><b id="hudTime">00:00.0</b><small id="hudLapTime">Lap — · PB —</small><small id="hudGap" class="rq-optional">Ke depan —</small></div>
    <div id="raceBankLabel" class="rq-stage">Stage</div>
   </section>
   <section class="rq-card rq-mission" aria-label="Progres soal"><div><b id="hudQuestion">SOAL 1 / 5</b><small id="hudGate">Menuju pos soal</small></div><div class="rq-progress" role="progressbar" id="hudQuestionProgress" aria-label="Menuju pos soal berikutnya" aria-valuemin="0" aria-valuemax="100"><i id="hudProgress"></i></div></section>
   <nav class="rq-toolbar" aria-label="Toolbar balapan">
    <button data-act="audio" aria-label="Pengaturan suara dan kontrol" title="Suara & kontrol"><svg viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
    <button data-act="restartRace" aria-label="Mulai ulang balapan" title="Mulai ulang balapan"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
    <button data-act="fullscreen" aria-label="Layar penuh" title="Layar penuh"><svg viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m6 0h6v-6"/></svg></button>
    <button data-act="pause" aria-label="Jeda balapan" title="Jeda · Esc / P" id="pauseRaceBtn"></button>
   </nav>
   <div id="hudNotice" class="rq-notice" role="status" aria-live="polite" hidden></div>
  </header>
  <section class="rq-inventory-dock" id="inventoryDock" aria-label="Inventori dua slot">
   <div class="rq-card rq-inventory" id="itemSlot"><div hidden><img id="itemIcon" alt=""><b id="itemName">Belum ada buff</b><small id="itemHint">Jawab benar untuk hadiah</small></div><button id="useItemBtn" data-act="useItem" disabled title="Gunakan slot terpilih · E / Spasi" aria-label="Gunakan buff terpilih">PAKAI [E]</button></div>
  </section>
  <section class="rq-card rq-speed" id="speedDock" aria-label="Kecepatan, token dan status"><div class="rq-speed-value"><b id="hudSpeed">0</b><small>KM/JAM</small></div><div class="rq-token"><b id="hudTokens">0</b><small>TOKEN</small></div><div id="hudEffect" class="rq-effect" aria-live="off"></div></section>
  <aside class="rq-map-rail" id="mapRail" aria-label="Peta dan radar"><div class="rq-card rq-map" id="mapPanel"><button id="mapToggle" type="button" aria-expanded="true" aria-controls="minimapFrame" title="Buka / tutup peta"><svg viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2ZM9 3v16m6-14v16"/></svg><span>PETA</span><span class="rq-map-chevron">⌄</span></button><div id="minimapFrame"><canvas id="minimap" width="220" height="220" aria-label="Peta lintasan, pemain dan AI"></canvas></div></div></aside>
  <div class="rq-directions rq-controls" id="directionControls" aria-label="Kemudi sentuh"><button class="rq-control touch-btn" data-control="left" aria-label="Belok kiri" id="leftControl"></button><button class="rq-control touch-btn" data-control="right" aria-label="Belok kanan" id="rightControl"></button></div>
  <div class="rq-actions rq-controls" id="actionControls" aria-label="Aksi sentuh"><button class="rq-control touch-btn" data-control="drift" aria-label="Drift" id="driftControl">D<small>DRIFT</small></button><button class="rq-control touch-btn" data-control="jump" aria-label="Loncat" id="jumpControl">↑<small>LONCAT</small></button><button class="rq-control touch-btn" data-control="brake" aria-label="Rem" id="brakeControl"></button><button class="rq-control touch-btn" data-control="gas" aria-label="Gas" id="gasControl"></button></div>
  <div id="speedLines" class="speed-lines" hidden></div>
  <div id="hudLegacy" hidden><div id="raceNotice" hidden></div><div id="raceJumpHint"></div><div id="hudBuff"></div></div>
 </div>
</section>
